# Local PostgreSQL 16 with the pgvector extension, for development and tests.
#   docker compose up -d db
# Then in .env: PGHOST=localhost PGPORT=5433 PGDATABASE=gradix PGUSER=gradix PGPASSWORD=gradix PGSSLMODE=disable
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gradix
      POSTGRES_PASSWORD: gradix
      POSTGRES_DB: gradix
    ports:
      - "5433:5432"
    volumes:
      - gradix-pg:/var/lib/postgresql/data
volumes:
  gradix-pg:
